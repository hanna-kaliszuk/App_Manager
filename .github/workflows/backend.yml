name: Backend testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: application_manager
          POSTGRES_USER: application_manager
          POSTGRES_PASSWORD: application_manager_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: application_manager
      POSTGRES_USER: application_manager
      POSTGRES_PASSWORD: application_manager_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Lint
        run: ruff check .
        working-directory: backend

      - name: Test
        run: python manage.py test
        working-directory: backend